name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Verify Environment Variables 🔍
        run: |
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then echo "✓ VITE_SUPABASE_URL detected"; else echo "✗ VITE_SUPABASE_URL missing"; fi
          if [ -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then echo "✓ VITE_SUPABASE_ANON_KEY detected"; else echo "✗ VITE_SUPABASE_ANON_KEY missing"; fi

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
