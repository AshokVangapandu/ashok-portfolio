<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/main.css?v=1.3">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(143, 133, 255, 0.1);
      border-top-color: #8f85ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    .admin-dashboard-container {
      display: none;
      max-width: 480px;
      width: 100%;
      padding: 40px 24px;
      text-align: center;
    }

    .crown-icon-box {
      margin-bottom: 24px;
      color: #ffd700;
      display: flex;
      justify-content: center;
    }

    .admin-title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 12px 0;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .admin-subtitle {
      font-size: 15px;
      font-weight: 500;
      color: #475569;
      margin: 0 0 24px 0;
      line-height: 1.6;
    }

    .features-panel {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      text-align: left;
      margin-bottom: 32px;
    }

    .features-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .features-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
    }

    .bullet {
      color: #ffd700;
      font-size: 18px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #0f172a;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      fontSize: 13px;
      font-weight: 600;
      padding: 12px 24px;
      text-decoration: none;
      transition: all 200ms ease;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
      cursor: pointer;
    }

    .back-btn:hover {
      background: #1e293b;
      transform: translateY(-1px);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading privileged status check screen -->
  <div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <p style="color: #64748b; font-size: 14px; margin: 0;">Verifying security privileges...</p>
  </div>

  <!-- Centered White Dashboard Mockup Layout -->
  <div class="admin-dashboard-container" id="admin-dashboard-container">
    <div class="crown-icon-box">
      <svg viewBox="0 0 24 24" width="80" height="80" fill="currentColor">
        <path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z" />
        <rect x="3" y="17" width="18" height="3" rx="1" />
      </svg>
    </div>
    <h1 class="admin-title">Admin Dashboard</h1>
    <p class="admin-subtitle">
      Welcome, Administrator!<br>
      This dashboard is currently under development.<br>
      Soon you'll be able to manage:
    </p>
    <div class="features-panel">
      <ul class="features-list">
        <li><span class="bullet">•</span><span>Contact Messages</span></li>
        <li><span class="bullet">•</span><span>Testimonials</span></li>
        <li><span class="bullet">•</span><span>Portfolio Content</span></li>
        <li><span class="bullet">•</span><span>Analytics</span></li>
        <li><span class="bullet">•</span><span>Settings</span></li>
      </ul>
    </div>
    <a href="../index.html" class="back-btn">← Back to Portfolio</a>
  </div>

  <!-- Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/components/toast.js" defer></script>
  <script src="../js/services/supabase-service.js" defer></script>

  <!-- Route Guard Script -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const initTimer = setInterval(() => {
        if (window.AuthService) {
          clearInterval(initTimer);
          authorizeAndRender();
        }
      }, 100);
    });

    async function authorizeAndRender() {
      // 1. Check user authentication
      const user = await window.AuthService.getCurrentUser();
      if (!user) {
        redirectToHome();
        return;
      }

      // 2. Query admins table
      let isAdmin = false;
      try {
        const { data, error } = await window.AuthService.supabase
          .from('admins')
          .select('email, role, is_active')
          .eq('email', user.email)
          .maybeSingle();

        if (!error && data && data.is_active === true) {
          isAdmin = true;
        }
      } catch (err) {
        console.error("Failed to query admin status:", err);
      }

      if (!isAdmin) {
        redirectToHome();
        return;
      }

      // 3. Authenticated Admin -> Hide loader and display layout
      document.getElementById("loading-screen").style.display = "none";
      document.getElementById("admin-dashboard-container").style.display = "block";

      // Listen for auth changes to kick user out if they logout in another tab
      window.AuthService.onAuthStateChange((event, session) => {
        if (!session) {
          window.location.href = "../index.html";
        }
      });
    }

    function redirectToHome() {
      console.warn("[Admin Guard] Access denied. Redirecting to home page...");
      window.location.href = "../index.html";
    }
  </script>
</body>
</html>
