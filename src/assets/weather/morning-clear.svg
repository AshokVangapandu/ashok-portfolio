<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="morningSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#FF9F0A" />
    </linearGradient>
    <linearGradient id="morningSky" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFD60A" stop-opacity="0.15" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="40" fill="url(#morningSky)" />
  <!-- Rays -->
  <g stroke="#FFD60A" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="15" x2="50" y2="23" />
    <line x1="50" y1="77" x2="50" y2="85" />
    <line x1="15" y1="50" x2="23" y2="50" />
    <line x1="77" y1="50" x2="85" y2="50" />
    <line x1="25" y1="25" x2="31" y2="31" />
    <line x1="69" y1="69" x2="75" y2="75" />
    <line x1="25" y1="79" x2="31" y2="73" />
    <line x1="69" y1="31" x2="75" y2="25" />
  </g>
  <!-- Sun Body -->
  <circle cx="50" cy="50" r="20" fill="url(#morningSun)" />
</svg>
