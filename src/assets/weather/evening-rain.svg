      <stop offset="0%" stop-color="#FF5E3A" />
      <stop offset="100%" stop-color="#FF2A68" />
    </linearGradient>
    <linearGradient id="rainCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E8E93" />
