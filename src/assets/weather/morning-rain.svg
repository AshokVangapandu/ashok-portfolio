<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="morningSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A" />
      <stop offset="100%" stop-color="#FF9F0A" />
    </linearGradient>
    <linearGradient id="darkCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1D1D6" />
      <stop offset="100%" stop-color="#8E8E93" />
    </linearGradient>
  </defs>
  <!-- Peeking Sun -->
  <circle cx="38" cy="38" r="16" fill="url(#morningSun)" />
  <!-- Rain Cloud -->
