  <!-- Rain Drops -->
  <g stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <line x1="33" y1="68" x2="29" y2="76" />
    <line x1="45" y1="68" x2="41" y2="76" />
    <line x1="57" y1="68" x2="53" y2="76" />
  </g>
</svg>
