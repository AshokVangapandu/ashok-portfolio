<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="eveningSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5E3A" />
      <stop offset="100%" stop-color="#FF2A68" />
    </linearGradient>
    <linearGradient id="sunsetSky" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2A68" stop-opacity="0" />
      <stop offset="100%" stop-color="#FF5E3A" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <!-- Sunset Glow -->
  <circle cx="50" cy="50" r="40" fill="url(#sunsetSky)" />
  <!-- Horizon Line -->
  <line x1="15" y1="65" x2="85" y2="65" stroke="#FF2A68" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
  <line x1="25" y1="72" x2="75" y2="72" stroke="#FF2A68" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  <!-- Setting Sun -->
  <circle cx="50" cy="54" r="18" fill="url(#eveningSun)" />
</svg>
