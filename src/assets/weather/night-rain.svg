  </defs>
  <!-- Moon behind Cloud -->
  <path d="M38 28 a15 15 0 1 1 15 15 a12 12 0 1 0 -15 -15 z" fill="url(#moonGrad)" opacity="0.85" />
  <!-- Cloud -->
