<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="afternoonSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#FF3B30" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF3B30" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Glow Rings -->
  <circle cx="50" cy="50" r="38" fill="url(#sunGlow)" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FF9F0A" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />
  <!-- Sun Body -->
  <circle cx="50" cy="50" r="22" fill="url(#afternoonSun)" />
</svg>
