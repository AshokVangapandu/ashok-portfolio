<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E5EA" />
      <stop offset="100%" stop-color="#AEAEB2" />
    </linearGradient>
    <linearGradient id="nightGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5856D6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0A0A14" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="40" fill="url(#nightGlow)" />
  <!-- Stars -->
  <g fill="#FFD60A" opacity="0.8">
    <!-- Star 1 -->
    <path d="M70 25 l1 2 l2 1 l-2 1 l-1 2 l-1 -2 l-2 -1 l2 -1 z" />
    <!-- Star 2 -->
    <path d="M28 35 l0.5 1 l1 0.5 l-1 0.5 l-0.5 1 l-0.5 -1 l-1 -0.5 l1 -0.5 z" />
    <!-- Star 3 -->
    <path d="M64 68 l0.5 1 l1 0.5 l-1 0.5 l-0.5 1 l-0.5 -1 l-1 -0.5 l1 -0.5 z" />
  </g>
  <!-- Crescent Moon -->
  <path d="M42 32 a20 20 0 1 1 20 20 a16 16 0 1 0 -20 -20 z" fill="url(#moonGrad)" filter="drop-shadow(0px 2px 5px rgba(255,255,255,0.05))" />
</svg>
